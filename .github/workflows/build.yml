name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log

      # Every successful build becomes a release; the newest APK is always at
      # https://github.com/wronglogin/smart-home/releases/latest/download/MojDom.apk
      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk MojDom.apk
          gh release create "v1.0.${{ github.run_number }}" MojDom.apk \
            --title "Mój Dom 1.0.${{ github.run_number }}" \
            --notes "Pobierz MojDom.apk i zainstaluj na telefonie. Commit ${GITHUB_SHA::7}." \
            --latest

      # A failed build opens an issue with the compiler errors, so they can be read and fixed.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo "Commit: $GITHUB_SHA"
            echo '```'
            grep -E '^e: |error:|What went wrong|FAILED|Could not' -A4 build.log | head -200 || true
            echo '```'
            echo '<details><summary>Koniec logu</summary>'
            echo
            echo '```'
            tail -80 build.log || true
            echo '```'
            echo '</details>'
          } > report.md
          gh issue create --title "Build #${{ github.run_number }} nie powiódł się" --body-file report.md
